# ONE REGION ON ONE VPS — Singapore, the US: no Coolify, the whole stack here.
#
# Europe stays on Coolify (datemeee). A region is ISOLATED: its own Postgres,
# its own Redis, its own accounts, seasons and raids. Only the image is shared,
# built once by .github/workflows/deploy-regions.yml and pulled from GHCR.
#
#   docker compose up -d          # Caddy + Postgres + Redis + migrate + rr-ws,
#                                 # and the same four again for the web2 world
#
# Postgres and Redis publish NO port: only rr-ws reaches them, on this network.
# Caddy takes 80/443 and fetches the certificate for $WS_DOMAIN by itself.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 keeps its data under a versioned subdirectory of this.
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis:/data

  # Runs once per `up`, before the server: the image's own `drizzle/`.
  migrate:
    image: ${RR_WS_IMAGE:-ghcr.io/llpekoll/rr-ws:latest}
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgres://rabbit:${POSTGRES_PASSWORD}@postgres:5432/rabbit
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rr-ws:
    image: ${RR_WS_IMAGE:-ghcr.io/llpekoll/rr-ws:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://rabbit:${POSTGRES_PASSWORD}@postgres:5432/rabbit
      REDIS_URL: redis://redis:6379
      WS_PORT: "3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # ── THE WEB2 WORLD (Google Play, iOS, portals) ─────────────────────────────
  # Same image, its OWN Postgres, Redis and JWT secret: a web3 burrow never
  # meets a web2 one, and a token from one world opens nothing in the other.
  # RR_WORLD=web2 switches off the wallet doors, the shop's crypto and the
  # Crown Race (src/lib/world.ts). No Solana variable reaches it.
  postgres-web2:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: ${WEB2_POSTGRES_PASSWORD:?set WEB2_POSTGRES_PASSWORD in .env}
    volumes:
      - pg-web2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-web2:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-web2:/data

  migrate-web2:
    image: ${RR_WS_IMAGE:-ghcr.io/llpekoll/rr-ws:latest}
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgres://rabbit:${WEB2_POSTGRES_PASSWORD}@postgres-web2:5432/rabbit
    depends_on:
      postgres-web2:
        condition: service_healthy
    restart: "no"

  # No env_file: the region's .env carries the web3 treasury and RPC. Only
  # what this world needs is named here.
  rr-ws-web2:
    image: ${RR_WS_IMAGE:-ghcr.io/llpekoll/rr-ws:latest}
    restart: unless-stopped
    environment:
      RR_WORLD: web2
      DATABASE_URL: postgres://rabbit:${WEB2_POSTGRES_PASSWORD}@postgres-web2:5432/rabbit
      REDIS_URL: redis://redis-web2:6379
      WS_PORT: "3010"
      WS_DOMAIN: ${WS2_DOMAIN}
      AUTH_ORIGIN: https://${WS2_DOMAIN}
      JWT_SIGNING_SECRET: ${WEB2_JWT_SIGNING_SECRET:?set WEB2_JWT_SIGNING_SECRET in .env}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JENVOIE_API_KEY: ${JENVOIE_API_KEY:-}
    depends_on:
      migrate-web2:
        condition: service_completed_successfully
      redis-web2:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WS_DOMAIN: ${WS_DOMAIN:?set WS_DOMAIN in .env}
      WS2_DOMAIN: ${WS2_DOMAIN:?set WS2_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - rr-ws
      - rr-ws-web2

volumes:
  pg:
  redis:
  pg-web2:
  redis-web2:
  caddy:
