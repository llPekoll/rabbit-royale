<!doctype html>
<!--
  LA PAGE DE PASSAGE DE RABBIT.RIP/PLAY/ (2026-10-19).

  Le jeu web3 du navigateur a demenage sur sol.rabbit.rip/play/ : rabbit.rip
  est desormais la vitrine du web2, qui ne mene jamais au web3. Mais les liens
  deja partages (X, Discord, notifications, ecrans d'accueil installes)
  pointent ici, et le terrier d'un invite n'existe QUE dans le stockage de
  cette origine. Cette page le reprend avant de partir :

    1. elle ouvre la base IndexedDB de Godot (/userfs, magasin FILE_DATA) ;
    2. elle lit session.cfg et consent.cfg sous
       /userfs/godot/app_userdata/Rabbit Royale/ (releve sur le vrai jeu le
       2026-10-19 : contenu Int8Array, texte ConfigFile) ;
    3. elle les passe a sol.rabbit.rip/play/ dans le FRAGMENT
       (#rr_move=<base64url d'un JSON {nom: texte}>), que le navigateur
       n'envoie a aucun serveur ; godot/scripts/session.gd
       (_import_moved_session) les y ecrit puis efface le fragment.

  Rien n'est efface ici : les fichiers restent, au cas ou. Le web2, quand il
  viendra ici, range sa session ailleurs (session-web2.cfg).

  Pas de lien visible vers le web3 : la page part d'elle-meme, et si le
  script ne tourne pas, le texte ne nomme pas l'adresse.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10222b" />
    <meta name="robots" content="noindex" />
    <title>Rabbit Royale</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10222b;
        color: #f7f0e1;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      img { width: 160px; height: auto; image-rendering: pixelated; }
      p { color: #b8c7c4; margin: 18px 16px 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.png" alt="Rabbit Royale" />
      <p>Taking you to your burrow&hellip;</p>
    </main>
    <script>
      (() => {
        const TARGET = 'https://sol.rabbit.rip/play/';
        const DIR = '/userfs/godot/app_userdata/Rabbit Royale/';
        const FILES = ['session.cfg', 'consent.cfg'];

        let gone = false;
        const go = (files) => {
          if (gone) return;
          gone = true;
          let url = TARGET + location.search;
          if (files && Object.keys(files).length) {
            const bytes = new TextEncoder().encode(JSON.stringify(files));
            let bin = '';
            bytes.forEach((b) => { bin += String.fromCharCode(b); });
            url += '#rr_move=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }
          location.replace(url);
        };

        // Une base qui ne repond pas (navigation privee, stockage bloque) ne
        // doit pas laisser le joueur sur cette page.
        setTimeout(() => go(null), 2500);

        try {
          const open = indexedDB.open('/userfs');
          // Ouvrir une base absente la cree, vide et sans magasin : on la
          // laisse telle quelle, il n'y a rien a reprendre.
          open.onupgradeneeded = () => open.transaction.abort();
          open.onerror = () => go(null);
          open.onsuccess = () => {
            const db = open.result;
            if (!db.objectStoreNames.contains('FILE_DATA')) return go(null);
            const store = db.transaction('FILE_DATA').objectStore('FILE_DATA');
            const files = {};
            let left = FILES.length;
            for (const name of FILES) {
              const req = store.get(DIR + name);
              req.onsuccess = () => {
                const v = req.result;
                if (v && v.contents) {
                  files[name] = new TextDecoder().decode(new Uint8Array(v.contents.buffer, v.contents.byteOffset, v.contents.byteLength));
                }
                if (--left === 0) go(files);
              };
              req.onerror = () => { if (--left === 0) go(files); };
            }
          };
        } catch (e) {
          go(null);
        }
      })();
    </script>
  </body>
</html>
