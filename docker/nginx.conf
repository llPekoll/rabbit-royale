server {
  listen 3010;
  root /usr/share/nginx/html;
  index index.html;

  # L'ART, CACHE DUR.
  #
  # Le serveur est en Finlande ; depuis l'Asie du sud-est, une revalidation par
  # image coute plus cher en aller-retours que les octets eux-memes. L'art est
  # immuable (une modification sort sous un nouveau nom de fichier), donc le
  # navigateur peut le garder un an sans jamais redemander.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Le HTML, jamais en cache : c'est lui qui nomme les bundles hashes.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Les ateliers, chacun son entree.
  location /island  { try_files $uri $uri/ /island/index.html; }
  location /isoworld { try_files $uri $uri/ /isoworld/index.html; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
