# THE REGIONS' DEPLOY — what Coolify does for Europe, done here for the VPS
# that have no Coolify (deploy/region).
#
# On push to main: build Dockerfile.ws ONCE, push it to GHCR, then on each
# region copy compose.yml + Caddyfile and `docker compose up -d` (which runs
# the migrations before the server).
#
# Secrets (Settings → Secrets and variables → Actions):
#   REGION_SSH_KEY   private key of the `deploy` user, same on every region
#   REGION_SG_HOST   IP or host of the Singapore VPS   (empty = skipped)
#   REGION_US_HOST   IP or host of the US VPS          (empty = skipped)
name: deploy-regions

on:
  push:
    branches: [main]
    paths:
      - server/**
      - src/**
      - config/**
      - drizzle/**
      - scripts/migrate.ts
      - Dockerfile.ws
      - package.json
      - bun.lock
      - deploy/region/**
      - .github/workflows/deploy-regions.yml
  workflow_dispatch:

concurrency:
  group: deploy-regions
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/llpekoll/rr-ws

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ws
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [sg, us]
    steps:
      - uses: actions/checkout@v4
      - name: Host of this region
        id: host
        env:
          SG: ${{ secrets.REGION_SG_HOST }}
          US: ${{ secrets.REGION_US_HOST }}
        run: |
          case "${{ matrix.region }}" in
            sg) echo "host=$SG" >> "$GITHUB_OUTPUT" ;;
            us) echo "host=$US" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Ship
        if: steps.host.outputs.host != ''
        env:
          HOST: ${{ steps.host.outputs.host }}
          KEY: ${{ secrets.REGION_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          SSH="ssh -i $HOME/key -o StrictHostKeyChecking=accept-new deploy@$HOST"
          scp -i ~/key -o StrictHostKeyChecking=accept-new \
            deploy/region/compose.yml deploy/region/Caddyfile "deploy@$HOST:/opt/rabbit/"
          # The package is private: log in for this pull only, with the job's
          # token, and log out — nothing long-lived is left on the VPS.
          $SSH "set -e
            cd /opt/rabbit
            echo '$TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
            export RR_WS_IMAGE=${IMAGE}:${TAG}
            docker compose pull migrate rr-ws
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f"
      - name: Health
        if: steps.host.outputs.host != ''
        env:
          HOST: ${{ steps.host.outputs.host }}
          KEY: ${{ secrets.REGION_SSH_KEY }}
        run: |
          for i in $(seq 1 20); do
            if ssh -i ~/key deploy@$HOST "docker compose -f /opt/rabbit/compose.yml exec -T rr-ws wget -qO- http://127.0.0.1:3010/health" >/dev/null 2>&1; then
              echo "healthy"; exit 0
            fi
            sleep 3
          done
          echo "rr-ws not healthy"; exit 1
