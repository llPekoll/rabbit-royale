# THE BACK OFFICE'S AGENTS on Singapore and the US (admin/server.ts, agent
# mode) — monitoring only, apart from the game: this workflow restarts the
# rr-admin container and nothing else. rr-ws, Postgres, Redis and Caddy are
# never touched (deploy-regions.yml is the game's deploy).
#
# The site itself (admin.rabbit.rip) is Coolify's, on the same push.
name: deploy-admin-agents

on:
  push:
    branches: [main]
    paths:
      - admin/**
      - Dockerfile.admin
      - .github/workflows/deploy-admin-agents.yml
  workflow_dispatch:

concurrency:
  group: deploy-admin-agents
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  ADMIN_IMAGE: ghcr.io/llpekoll/rr-admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ github.sha }}
            ${{ env.ADMIN_IMAGE }}:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [sg, us]
    steps:
      - name: Host of this region
        id: host
        env:
          SG: ${{ secrets.REGION_SG_HOST }}
          US: ${{ secrets.REGION_US_HOST }}
        run: |
          case "${{ matrix.region }}" in
            sg) echo "host=$SG" >> "$GITHUB_OUTPUT" ;;
            us) echo "host=$US" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Ship the agent only
        if: steps.host.outputs.host != ''
        env:
          HOST: ${{ steps.host.outputs.host }}
          KEY: ${{ secrets.REGION_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          # :latest, the tag compose.yml names by default: the game's deploy
          # (`up -d`) then finds rr-admin unchanged and leaves it running.
          ssh -i ~/key -o StrictHostKeyChecking=accept-new deploy@$HOST "set -e
            cd /opt/rabbit
            echo '$TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
            docker compose pull rr-admin
            docker compose up -d --no-deps rr-admin
            docker logout ghcr.io
            docker image prune -f"
