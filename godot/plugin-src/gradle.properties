# AndroidX est OBLIGATOIRE ici, et pas par goût : org.godotengine:godot tire
# androidx.fragment, et mobile-wallet-adapter-clientlib-ktx tire
# androidx.activity-ktx. Sans ce drapeau, AGP refuse de compiler dès qu'il voit
# une de ces deux chaînes.
#
# C'est aussi ce qui rend le cast de RabbitMwaPlugin légitime : l'activité de
# Godot descend de FragmentActivity, donc de ComponentActivity, ce que
# ActivityResultSender exige.
android.useAndroidX=true

# Chaque module n'a droit qu'à SES ressources dans son R (firebase : l'icône de
# notification ; mwa : aucune). Pas de R géant recopiant celles de Firebase ou
# d'AndroidX à chaque build — et un nom de ressource ne peut pas « marcher »
# par hasard parce qu'une dépendance l'apportait.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
