<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* LA CAROTTE QUI SE REMPLIT, a la place de la barre bleue du navigateur.
   Deux fois la meme icone 32x30 (ui/icons/carrot), agrandie au pixel pres :
   dessous la silhouette eteinte, dessus la carotte en couleur, decouverte
   de la pointe (en bas) vers les fanes (en haut) a mesure que les octets
   arrivent. --fill va de 0 a 1. Le splash de Godot est masque : la carotte
   tient seule le centre de l'ecran. */
#status-splash {
	display: none;
}

#status-progress {
	position: relative;
	flex-direction: column;
	align-items: center;
	gap: 1.25rem;
	--fill: 0;
}

.carrot {
	position: relative;
	width: 192px;
	height: 180px;
}

.carrot img {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}

.carrot .carrot-empty {
	filter: brightness(0) invert(1);
	opacity: 0.12;
}

.carrot .carrot-full {
	clip-path: inset(calc((1 - var(--fill)) * 100%) 0 0 0);
}

/* Taille inconnue (pas de Content-Length) ou telechargement fini pendant que
   le wasm compile : la carotte, pleine ou non, respire. */
#status-progress.busy .carrot {
	animation: carrot-bob 0.9s ease-in-out infinite;
}

@keyframes carrot-bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

#status-percent {
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 14px;
	letter-spacing: 0.08em;
	color: #f5a04a;
	opacity: 0.85;
	min-height: 1em;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* TOURNE TON TELEPHONE (2026-09-30). Le jeu est fait couche : en portrait
   sur iPhone il demarrait debout puis basculait, sans rien dire. Safari ne
   laisse pas une page verrouiller l'orientation — on le demande donc. CSS
   seul : le voile vient et part avec le telephone, avant meme le moteur. */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #1b1f2a;
	color: #f5e6c8;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 16px;
	letter-spacing: 0.04em;
	text-align: center;
	padding: 0 32px;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate { display: flex; }
}

#rotate .phone {
	width: 44px;
	height: 76px;
	border: 4px solid #f5a04a;
	border-radius: 8px;
	box-sizing: border-box;
	animation: rotate-phone 2.4s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(0deg); }
	50%, 80% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}
		</style>

		<script>
/* LE WALLET DU NAVIGATEUR, pour wallet.gd (branche web).
   Android a son plugin MWA ; ici c'est le wallet injecte (Phantom, Solflare,
   Backpack...). Godot ne sait pas attendre une Promise : chaque appel prend
   un rappel (valeur, erreur), et la valeur vide veut dire refus ou panne.
   Le rappel n'est JAMAIS synchrone : Godot n'a pas encore commence a
   attendre quand l'appel revient, et un signal emis trop tot est perdu. */
window.rrWalletWeb = (function () {
	const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
	function base58(bytes) {
		const digits = [];
		for (const byte of bytes) {
			let carry = byte;
			for (let i = 0; i < digits.length; i++) {
				carry += digits[i] << 8;
				digits[i] = carry % 58;
				carry = (carry / 58) | 0;
			}
			while (carry > 0) {
				digits.push(carry % 58);
				carry = (carry / 58) | 0;
			}
		}
		let out = '';
		for (let i = 0; i < bytes.length && bytes[i] === 0; i++) out += '1';
		for (let i = digits.length - 1; i >= 0; i--) out += ALPHABET[digits[i]];
		return out;
	}
	function provider() {
		const phantom = window.phantom && window.phantom.solana;
		if (phantom) return phantom;
		if (window.solflare && window.solflare.signMessage) return window.solflare;
		if (window.backpack && window.backpack.signMessage) return window.backpack;
		return window.solana || null;
	}
	let web3Promise = null;
	function loadWeb3() {
		if (window.solanaWeb3) return Promise.resolve(window.solanaWeb3);
		web3Promise = web3Promise || new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = 'https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js';
			s.onload = function () { resolve(window.solanaWeb3); };
			s.onerror = function () { web3Promise = null; reject(new Error('could not load the payment library')); };
			document.head.appendChild(s);
		});
		return web3Promise;
	}
	function reason(e) {
		// 4001 = l'utilisateur a ferme la fenetre : un refus, pas une panne.
		if (e && (e.code === 4001 || /reject|denied|cancel/i.test(String(e.message)))) return '';
		return String((e && e.message) || e || 'wallet error');
	}
	return {
		available: function () { return provider() !== null; },
		address: function (cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			Promise.resolve(w.connect())
				.then(function (r) {
					const key = (r && r.publicKey) || w.publicKey;
					cb(key ? key.toString() : '', '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
		// PAYER : la transaction vient du serveur, en base64, non signee. Le
		// wallet de l'extension veut un objet Transaction, pas des octets :
		// web3.js est charge au PREMIER paiement (jsdelivr), jamais au boot —
		// ~140 Ko gzip pour une boutique que la plupart n'ouvrent pas.
		send: function (txBase64, _cluster, cb) {
			const w = provider();
			if (!w || !w.signAndSendTransaction) return setTimeout(function () { cb('', ''); }, 0);
			loadWeb3()
				.then(function (web3) {
					const bytes = Uint8Array.from(atob(txBase64), function (c) { return c.charCodeAt(0); });
					return Promise.resolve(w.connect()).then(function () {
						return w.signAndSendTransaction(web3.Transaction.from(bytes));
					});
				})
				.then(function (r) {
					const sig = (r && r.signature) || r;
					cb(typeof sig === 'string' ? sig : base58(new Uint8Array(sig)), '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
		sign: function (message, cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			Promise.resolve(w.signMessage(new TextEncoder().encode(message), 'utf8'))
				.then(function (r) {
					const sig = (r && r.signature) || r;
					cb(typeof sig === 'string' ? sig : base58(new Uint8Array(sig)), '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
	};
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const fill = Math.min(current / total, 1);
					// Par rangees entieres du sprite (30 px de haut) : le bord
					// ne coupe jamais un pixel en deux. La carotte n'occupe que
					// les rangees 8 a 28 ; au-dessus c'est du vide, qu'on ne
					// compte pas, sinon elle parait pleine des 73 %.
					const rows = Math.floor(fill * 21);
					statusProgress.style.setProperty('--fill', (rows + 1) / 30);
					statusPercent.textContent = Math.floor(fill * 100) + ' %';
					// Tout est la : reste la compilation du wasm, muette.
					statusProgress.classList.toggle('busy', fill >= 1);
				} else {
					statusProgress.classList.add('busy');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
