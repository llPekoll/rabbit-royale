		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* LA CAROTTE QUI SE REMPLIT, a la place de la barre bleue du navigateur.
   Deux fois la meme icone 32x30 (ui/icons/carrot), agrandie au pixel pres :
   dessous la silhouette eteinte, dessus la carotte en couleur, decouverte
   de la pointe (en bas) vers les fanes (en haut) a mesure que les octets
   arrivent. --fill va de 0 a 1. Le splash de Godot est masque : la carotte
   tient seule le centre de l'ecran. */
#status-splash {
	display: none;
}

#status-progress {
	position: relative;
	flex-direction: column;
	align-items: center;
	gap: 1.25rem;
	--fill: 0;
}

.carrot {
	position: relative;
	width: 192px;
	height: 180px;
}

.carrot img {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}

.carrot .carrot-empty {
	filter: brightness(0) invert(1);
	opacity: 0.12;
}

.carrot .carrot-full {
	clip-path: inset(calc((1 - var(--fill)) * 100%) 0 0 0);
}

/* Taille inconnue (pas de Content-Length) ou telechargement fini pendant que
   le wasm compile : la carotte, pleine ou non, respire. */
#status-progress.busy .carrot {
	animation: carrot-bob 0.9s ease-in-out infinite;
}

@keyframes carrot-bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

#status-percent {
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 14px;
	letter-spacing: 0.08em;
	color: #f5a04a;
	opacity: 0.85;
	min-height: 1em;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* TOURNE TON TELEPHONE (2026-09-30). Le jeu est fait couche : en portrait
   sur iPhone il demarrait debout puis basculait, sans rien dire. Safari ne
   laisse pas une page verrouiller l'orientation — on le demande donc. CSS
   seul : le voile vient et part avec le telephone, avant meme le moteur. */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #1b1f2a;
	color: #f5e6c8;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 16px;
	letter-spacing: 0.04em;
	text-align: center;
	padding: 0 32px;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate { display: flex; }
}

#rotate .phone {
	width: 44px;
	height: 76px;
	border: 4px solid #f5a04a;
	border-radius: 8px;
	box-sizing: border-box;
	animation: rotate-phone 2.4s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(0deg); }
	50%, 80% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

		<script>
/* PLEIN ECRAN, pour top_bar.gd (branche web) (2026-10-12). Dans le
   navigateur, la barre d'adresse et les onglets mangent le haut du jeu. Le
   bouton est un anneau du chrome, a gauche du lapin, et sur ordinateur
   seulement (top_bar.gd) : un bouton HTML passait par-dessus les fenetres de
   Godot. La page ne fait que la bascule :
     supported()  -> faux sans l'API et en app installee (deja sans barre)
     active()     -> en plein ecran ou non
     toggle()     -> la bascule ; Godot l'appelle dans la frame de la tape,
                     encore dans l'activation du geste
     onChange(cb) -> cb(actif) a chaque entree ou sortie, Echap compris */
window.rrFullscreen = (function () {
	const root = document.documentElement;
	const request = root.requestFullscreen || root.webkitRequestFullscreen;
	const exit = document.exitFullscreen || document.webkitExitFullscreen;
	let changed = null;
	function active() {
		return !!(document.fullscreenElement || document.webkitFullscreenElement);
	}
	function standalone() {
		return window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
	}
	function emit() {
		if (changed) changed(active());
	}
	document.addEventListener('fullscreenchange', emit);
	document.addEventListener('webkitfullscreenchange', emit);
	return {
		supported: function () { return !!request && !standalone(); },
		active: active,
		toggle: function () {
			if (active()) {
				Promise.resolve(exit.call(document)).catch(function () {});
				return;
			}
			Promise.resolve(request.call(root, { navigationUI: 'hide' })).catch(function () {});
		},
		onChange: function (cb) { changed = cb; },
	};
})();
		</script>

		<script>
/* LE WALLET DU NAVIGATEUR, pour wallet.gd (branche web).
   Android a son plugin MWA ; ici c'est le wallet injecte (Phantom, Solflare,
   Backpack...). Godot ne sait pas attendre une Promise : chaque appel prend
   un rappel (valeur, erreur), et la valeur vide veut dire refus ou panne.
   Le rappel n'est JAMAIS synchrone : Godot n'a pas encore commence a
   attendre quand l'appel revient, et un signal emis trop tot est perdu. */
window.rrWalletWeb = (function () {
	const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
	function base58(bytes) {
		const digits = [];
		for (const byte of bytes) {
			let carry = byte;
			for (let i = 0; i < digits.length; i++) {
				carry += digits[i] << 8;
				digits[i] = carry % 58;
				carry = (carry / 58) | 0;
			}
			while (carry > 0) {
				digits.push(carry % 58);
				carry = (carry / 58) | 0;
			}
		}
		let out = '';
		for (let i = 0; i < bytes.length && bytes[i] === 0; i++) out += '1';
		for (let i = digits.length - 1; i >= 0; i--) out += ALPHABET[digits[i]];
		return out;
	}
	function provider() {
		const phantom = window.phantom && window.phantom.solana;
		if (phantom) return phantom;
		if (window.solflare && window.solflare.signMessage) return window.solflare;
		if (window.backpack && window.backpack.signMessage) return window.backpack;
		return window.solana || null;
	}
	let web3Promise = null;
	function loadWeb3() {
		if (window.solanaWeb3) return Promise.resolve(window.solanaWeb3);
		web3Promise = web3Promise || new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = 'https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js';
			s.onload = function () { resolve(window.solanaWeb3); };
			s.onerror = function () { web3Promise = null; reject(new Error('could not load the payment library')); };
			document.head.appendChild(s);
		});
		return web3Promise;
	}
	function reason(e) {
		// 4001 = l'utilisateur a ferme la fenetre : un refus, pas une panne.
		if (e && (e.code === 4001 || /reject|denied|cancel/i.test(String(e.message)))) return '';
		return String((e && e.message) || e || 'wallet error');
	}
	return {
		available: function () { return provider() !== null; },
		address: function (cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			Promise.resolve(w.connect())
				.then(function (r) {
					const key = (r && r.publicKey) || w.publicKey;
					cb(key ? key.toString() : '', '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
		// PAYER : la transaction vient du serveur, en base64, non signee. Le
		// wallet de l'extension veut un objet Transaction, pas des octets :
		// web3.js est charge au PREMIER paiement (jsdelivr), jamais au boot —
		// ~140 Ko gzip pour une boutique que la plupart n'ouvrent pas.
		//
		// N'importe quel wallet paie : la tx est construite pour celui qui est
		// OUVERT (shop.gd lui demande son adresse avant le devis), pas pour
		// celui du compte. Et si signAndSendTransaction casse quand meme sans
		// raison (Phantom « Unexpected error », -32603, 2026-10-13), on lui
		// redemande de SIGNER seulement, et c'est le serveur qui envoie
		// (« signed:<base64> », PATCH /api/shop/pay `signedTx`).
		send: function (txBase64, _cluster, cb) {
			const w = provider();
			if (!w || !w.signAndSendTransaction) return setTimeout(function () { cb('', ''); }, 0);
			let tx = null;
			loadWeb3()
				.then(function (web3) {
					const bytes = Uint8Array.from(atob(txBase64), function (c) { return c.charCodeAt(0); });
					tx = web3.Transaction.from(bytes);
					return Promise.resolve(w.connect());
				})
				.then(function () {
					return w.signAndSendTransaction(tx).then(function (r) {
						const sig = (r && r.signature) || r;
						return typeof sig === 'string' ? sig : base58(new Uint8Array(sig));
					}, function (e) {
						if (reason(e) === '' || !w.signTransaction) throw e;
						console.warn('[wallet] signAndSendTransaction failed, signing only', e);
						return Promise.resolve(w.signTransaction(tx)).then(function (signed) {
							const raw = signed.serialize({ requireAllSignatures: true, verifySignatures: false });
							let bin = '';
							for (let i = 0; i < raw.length; i++) bin += String.fromCharCode(raw[i]);
							return 'signed:' + btoa(bin);
						});
					});
				})
				.then(function (sig) { cb(sig, ''); })
				.catch(function (e) {
					console.warn('[wallet] payment failed', e);
					cb('', reason(e));
				});
		},
		sign: function (message, cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			// Le 2e argument n'est pas le meme partout : Phantom et Solflare
			// y lisent l'affichage ('utf8'), Backpack le COMPTE qui signe
			// (signMessage(msg, publicKey?)). Lui passer 'utf8' signait pour
			// une cle qui n'existe pas : approuve dans le wallet, refuse ici
			// (2026-11-01, un joueur web).
			const bytes = new TextEncoder().encode(message);
			Promise.resolve(w.isBackpack ? w.signMessage(bytes) : w.signMessage(bytes, 'utf8'))
				.then(function (r) {
					const sig = (r && r.signature) || r;
					cb(typeof sig === 'string' ? sig : base58(new Uint8Array(sig)), '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
	};
})();
		</script>

		<script>
/* LE GOLD PAYE SANS QUITTER LE JEU, pour store_pay.gd (web2, 2026-11-01).
   Le formulaire de Stripe (Checkout « embedded », une iframe de Stripe) monte
   dans un voile PAR-DESSUS le canevas : le jeu tourne dessous et ne recharge
   pas. Avant, il partait sur la page de Stripe et revenait de zero.
     open(cle, secret, cb) -> cb('complete' | 'closed' | 'error:<raison>'),
                              jamais synchrone (cf. rrWalletWeb)
   Stripe.js est charge au PREMIER achat (js.stripe.com, il ne se copie pas),
   jamais au boot. Une seule session embarquee a la fois chez Stripe : la
   precedente est detruite avant d'en monter une autre. Un moyen de paiement
   qui doit passer par sa banque (iDEAL...) emmene encore la page, et revient
   par ?gold=done&session_id= comme avant. */
window.rrStripeCheckout = (function () {
	let loading = null;
	let stripe = null;
	let stripeKey = '';
	let current = null;
	function load() {
		if (window.Stripe) return Promise.resolve();
		loading = loading || new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = 'https://js.stripe.com/v3/';
			s.onload = function () { resolve(); };
			s.onerror = function () { loading = null; reject(new Error('could not load Stripe')); };
			document.head.appendChild(s);
		});
		return loading;
	}
	function finish(mine, state) {
		if (current !== mine) return;
		current = null;
		try { if (mine.checkout) mine.checkout.destroy(); } catch (e) {}
		mine.root.remove();
		setTimeout(function () { mine.cb(state); }, 0);
	}
	function veil() {
		const root = document.createElement('div');
		root.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(12,9,6,.78);'
			+ 'display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;';
		const box = document.createElement('div');
		box.style.cssText = 'position:relative;width:min(480px,100%);max-height:100%;overflow-y:auto;'
			+ 'touch-action:pan-y;-webkit-overflow-scrolling:touch;background:#fff;border-radius:12px;';
		const wait = document.createElement('div');
		wait.textContent = '...';
		wait.style.cssText = 'padding:48px 0;text-align:center;font:24px sans-serif;color:#888;';
		box.appendChild(wait);
		const close = document.createElement('button');
		close.type = 'button';
		close.textContent = '\u00d7';
		close.setAttribute('aria-label', 'Close');
		close.style.cssText = 'position:fixed;top:12px;right:12px;width:44px;height:44px;border:0;'
			+ 'border-radius:22px;background:#fff;color:#222;font:28px/44px sans-serif;cursor:pointer;';
		root.appendChild(box);
		root.appendChild(close);
		document.body.appendChild(root);
		return { root: root, box: box, wait: wait, close: close };
	}
	return {
		open: function (key, secret, cb) {
			if (current) finish(current, 'closed');
			const v = veil();
			const mine = { root: v.root, cb: cb, checkout: null };
			current = mine;
			v.close.onclick = function () { finish(mine, 'closed'); };
			load()
				.then(function () {
					if (!stripe || stripeKey !== key) {
						stripe = window.Stripe(key);
						stripeKey = key;
					}
					return stripe.initEmbeddedCheckout({
						fetchClientSecret: function () { return Promise.resolve(secret); },
						onComplete: function () { finish(mine, 'complete'); },
					});
				})
				.then(function (checkout) {
					if (current !== mine) {
						checkout.destroy();
						return;
					}
					mine.checkout = checkout;
					v.wait.remove();
					checkout.mount(v.box);
				})
				.catch(function (e) {
					console.warn('[stripe] embedded checkout failed', e);
					finish(mine, 'error:' + String((e && e.message) || e));
				});
		},
	};
})();
		</script>

		<script>
/* FIREBASE, pour analytics.gd et push.gd (branche web).
   Android a son plugin RabbitFirebase ; ici c'est le SDK JS « compat »,
   epingle sur gstatic et charge EN DIFFERE : jamais sur le chemin du boot (le
   moteur passe d'abord), et jamais du tout tant que la config porte des TODO.

   Le contrat, le meme que le plugin :
     setConsent(analytics, ads)  -> la reponse du joueur (consent.gd), dite
                                    par Godot au demarrage puis a chaque choix
     logEvent(nom, paramsJson)   setUserId(id)   setUserProperty(cle, valeur)
     requestPush(cb)   -> cb(jeton), "" sur refus, panne ou config absente
     pushState()       -> 'granted' | 'denied' | 'default' | 'unsupported'
     launchPath()      -> le chemin de la notification qui a ouvert la page
                          (?push=), une seule fois ; "" sinon
     onPushOpened(cb)  -> cb(chemin) quand une notification est tapee alors
                          que le jeu est deja ouvert (le service worker nous
                          le poste au lieu d'ouvrir un second onglet)
   Comme rrWalletWeb, un rappel n'est JAMAIS synchrone : Godot n'a pas encore
   commence a attendre quand l'appel revient.

   LE CONSENTEMENT DECIDE DU CHARGEMENT (RGPD, CNIL). Le morceau Analytics du
   SDK — celui qui charge gtag.js et depose le cookie `_ga` — n'est charge
   qu'APRES un oui. Tant que Godot n'a rien dit, les appels attendent dans une
   petite file sans rien charger ; sur un « non » (ou « pas encore », pour un
   joueur europeen), la file est jetee et rien ne part. Le coeur de Firebase
   et Messaging, eux, se chargent quand le joueur DEMANDE les notifications :
   c'est lui qui les veut, et ils ne portent pas GA.
   Le mode de consentement de Google (`gtag('consent', ...)`) est pose dans
   la file de gtag AVANT le SDK : `default` a l'etat du moment, `update` a
   chaque changement ; un retrait coupe aussi GA (`ga-disable-<id>`) et
   efface les cookies `_ga`.

   LES ERREURS DE LA PAGE (window.onerror, promesses rejetees, sortie du
   moteur en erreur) partent en `exception` GA — soumises au meme oui : sans
   GA il n'y a pas ou les envoyer. Une fois par message, vingt au plus.

   Les appels d'analytics faits avant que le SDK soit la attendent dans une
   petite file, videe a son arrivee ; si le SDK ne vient pas (bloqueur,
   hors ligne), la file est jetee sans bruit. */
window.rrFirebase = (function () {
	const VERSION = '12.19.0';
	const BASE = 'https://www.gstatic.com/firebasejs/' + VERSION + '/';
	const cfg = window.RR_FIREBASE_CONFIG || null;
	function filled(k) {
		return !!cfg && typeof cfg[k] === 'string' && cfg[k] !== '' && !/TODO/.test(cfg[k]);
	}
	const configured = ['apiKey', 'authDomain', 'projectId', 'messagingSenderId', 'appId', 'measurementId'].every(filled);
	const pushConfigured = configured && filled('vapidKey');
	// DebugView de GA4 : /play/?analytics_debug
	const debug = /[?&]analytics_debug\b/.test(location.search);

	// LA FILE DE GTAG, a nous avant d'etre au SDK : Firebase reprend
	// `dataLayer` s'il existe et enveloppe `gtag` sans rien jeter. Ce qu'on y
	// pousse avant `config` (le consentement) est lu avant la premiere mesure.
	// gtag.js veut l'objet `arguments` lui-meme, pas un tableau.
	window.dataLayer = window.dataLayer || [];
	function gtag() { window.dataLayer.push(arguments); }

	// null : Godot n'a encore rien dit. Sinon { analytics, ads }.
	let consent = null;
	function consentMode(c) {
		const a = c.analytics ? 'granted' : 'denied';
		const ads = c.ads ? 'granted' : 'denied';
		return { analytics_storage: a, ad_storage: ads, ad_user_data: ads, ad_personalization: ads };
	}
	// L'interrupteur officiel de GA : tant qu'il est vrai, gtag n'envoie
	// RIEN, meme les evenements automatiques (user_engagement a la sortie).
	function gaDisable(off) {
		if (filled('measurementId')) window['ga-disable-' + cfg.measurementId] = !!off;
	}
	// Les cookies de GA (_ga, _ga_<id>), sur le domaine et ses parents.
	function clearGaCookies() {
		const host = location.hostname.split('.');
		const domains = [''];
		for (let i = 0; i < host.length - 1; i++) domains.push('; domain=.' + host.slice(i).join('.'));
		document.cookie.split(';').forEach(function (pair) {
			const name = pair.split('=')[0].trim();
			if (!/^_ga/.test(name)) return;
			domains.forEach(function (d) {
				document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + d;
			});
		});
	}

	// Le chemin d'une notification qui a ouvert la page, lu UNE fois et retire
	// de l'adresse : un rechargement ne doit pas rejouer la tape.
	let launch = '';
	try {
		const url = new URL(location.href);
		launch = url.searchParams.get('push') || '';
		if (launch) {
			url.searchParams.delete('push');
			history.replaceState(history.state, '', url.pathname + url.search + url.hash);
		}
	} catch (e) { launch = ''; }

	// La tape sur une notification, jeu deja ouvert : postee par le worker.
	let openedCb = null;
	const openedQueue = [];
	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.addEventListener('message', function (e) {
			const path = e.data && e.data.rrPush;
			if (typeof path !== 'string' || !path) return;
			if (openedCb) openedCb(path); else openedQueue.push(path);
		});
	}

	let app = null;
	let analytics = null;
	let messaging = null;
	let coreBoot = null;
	let analyticsBoot = null;
	let messagingBoot = null;
	let queue = [];
	const QUEUE_MAX = 200;

	function load(src) {
		return new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = src;
			s.async = true;
			s.onload = resolve;
			s.onerror = function () { reject(new Error('could not load ' + src)); };
			document.head.appendChild(s);
		});
	}

	// LE COEUR : firebase-app seul. Aucune requete, aucun cookie — il ne fait
	// que tenir la config pour les deux autres.
	function core() {
		if (!configured) return Promise.reject(new Error('firebase config missing'));
		coreBoot = coreBoot || load(BASE + 'firebase-app-compat.js').then(function () {
			app = firebase.initializeApp(cfg);
			return app;
		});
		return coreBoot;
	}

	// ANALYTICS, APRES UN OUI SEULEMENT. Le consentement du moment est pose
	// dans la file de gtag avant que le SDK n'y ecrive son `config`.
	function bootAnalytics() {
		if (!configured || !consent || !consent.analytics) return Promise.resolve(false);
		if (analyticsBoot) return analyticsBoot;
		analyticsBoot = core()
			.then(function () { return load(BASE + 'firebase-analytics-compat.js'); })
			.then(function () { return firebase.analytics.isSupported(); })
			.then(function (ok) {
				// Retire pendant le chargement : on ne l'allume pas.
				if (!ok || !consent || !consent.analytics) return false;
				gaDisable(false);
				gtag('consent', 'default', consentMode(consent));
				analytics = firebase.analytics(app);
				const pending = queue;
				queue = [];
				pending.forEach(function (fn) { fn(); });
				return true;
			})
			.catch(function (e) {
				// Un bloqueur, le reseau : le jeu n'a pas a le savoir.
				console.warn('[rrFirebase] analytics off:', e && e.message);
				queue = [];
				return false;
			});
		return analyticsBoot;
	}

	// MESSAGING, quand le joueur demande les notifications.
	function bootMessaging() {
		if (!pushConfigured) return Promise.resolve(false);
		messagingBoot = messagingBoot || core()
			.then(function () { return load(BASE + 'firebase-messaging-compat.js'); })
			.then(function () {
				return firebase.messaging && firebase.messaging.isSupported
					? firebase.messaging.isSupported() : false;
			})
			.then(function (ok) {
				if (ok) messaging = firebase.messaging(app);
				return !!messaging;
			})
			.catch(function (e) {
				console.warn('[rrFirebase] messaging off:', e && e.message);
				return false;
			});
		return messagingBoot;
	}

	// Chaque appel d'analytics passe par ici : tout de suite si le SDK est la,
	// sinon dans la file (bornee) — mais seulement si le joueur n'a pas dit non.
	function withAnalytics(fn) {
		if (!configured) return;
		if (consent && !consent.analytics) return;
		const run = function () {
			if (analytics && consent && consent.analytics) { try { fn(analytics); } catch (e) { /* muet */ } }
		};
		if (analytics) return run();
		if (queue.length < QUEUE_MAX) queue.push(run);
		if (consent) bootAnalytics();
	}

	// LES ERREURS DE LA PAGE, une fois chacune, vingt au plus.
	const errorsSeen = {};
	let errorsSent = 0;
	const ERRORS_MAX = 20;
	function reportError(message, where, fatal) {
		const text = String(message || 'error');
		const key = where + '|' + text;
		if (errorsSeen[key] || errorsSent >= ERRORS_MAX) return;
		errorsSeen[key] = true;
		errorsSent += 1;
		const params = { description: text.slice(0, 100), fatal: !!fatal, where: String(where || '').slice(0, 100), kind: 'js' };
		if (debug) params.debug_mode = true;
		withAnalytics(function (a) { a.logEvent('exception', params); });
	}
	// L'ABANDON DU MOTEUR : WebAssembly leve un RuntimeError (unreachable, out
	// of bounds), Emscripten dit « Aborted(...) ». Le reste est une erreur de
	// page que le jeu survit.
	function isAbort(err, message) {
		return (typeof WebAssembly !== 'undefined' && err instanceof WebAssembly.RuntimeError)
			|| /\bAborted\b|RuntimeError|unreachable/.test(String(message || ''));
	}
	window.addEventListener('error', function (e) {
		// Les extensions (wallets) jettent leurs erreurs dans la page : pas les
		// notres, pas a nous de les compter.
		if (e.filename && !/^https?:/.test(e.filename)) return;
		const where = (e.filename || '').split('/').pop() + ':' + (e.lineno || 0);
		reportError(e.message || (e.error && e.error.message), where, isAbort(e.error, e.message));
	});
	window.addEventListener('unhandledrejection', function (e) {
		const r = e.reason;
		const message = (r && (r.message || r.toString())) || 'unhandled rejection';
		reportError(message, 'promise', isAbort(r, message));
	});

	// Le worker des notifications, sous /play/ et a portee /play/, ACTIF avant
	// que getToken le lise.
	function worker() {
		return navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './' })
			.then(function (reg) {
				if (reg.active) return reg;
				return new Promise(function (resolve) {
					const sw = reg.installing || reg.waiting;
					if (!sw) return resolve(reg);
					sw.addEventListener('statechange', function () {
						if (sw.state === 'activated') resolve(reg);
					});
				});
			});
	}

	function pushState() {
		if (!pushConfigured || !('Notification' in window) || !('serviceWorker' in navigator)
			|| !('PushManager' in window)) return 'unsupported';
		return Notification.permission;
	}

	// La demande DOIT partir dans le geste du joueur : on l'appelle avant tout
	// `then`. Les vieux Safari rendent la reponse a un rappel, pas une Promise.
	function askPermission() {
		if (Notification.permission === 'granted') return Promise.resolve('granted');
		return new Promise(function (resolve) {
			const ret = Notification.requestPermission(resolve);
			if (ret && ret.then) ret.then(resolve);
		});
	}

	return {
		setConsent: function (analyticsGranted, adsGranted) {
			const was = consent;
			consent = { analytics: !!analyticsGranted, ads: !!adsGranted };
			if (analyticsBoot) gtag('consent', 'update', consentMode(consent));
			if (!consent.analytics) {
				queue = [];
				if (analyticsBoot) gaDisable(true);
				if (was && was.analytics) clearGaCookies();
				return;
			}
			gaDisable(false);
			bootAnalytics();
		},
		// Pour les sondes (et la console) : ou en est-on.
		state: function () {
			return JSON.stringify({ consent: consent, analytics: !!analytics, loading: !!analyticsBoot && !analytics, messaging: !!messaging });
		},
		logEvent: function (name, paramsJson) {
			let params = {};
			try { params = JSON.parse(paramsJson || '{}') || {}; } catch (e) { params = {}; }
			// Les rapports d'ecrans de GA4 lisent firebase_screen*, que Godot ne
			// peut pas nommer (prefixe reserve, analytics.gd le retire).
			if (name === 'screen_view') {
				params.firebase_screen = params.screen_name;
				params.firebase_screen_class = params.screen_class;
			}
			// GA4 veut un booleen ; Godot n'envoie que texte et nombres.
			if (name === 'exception' && typeof params.fatal === 'string') params.fatal = params.fatal === 'true';
			if (debug) params.debug_mode = true;
			withAnalytics(function (a) { a.logEvent(name, params); });
		},
		setUserId: function (id) {
			withAnalytics(function (a) { a.setUserId(id ? String(id) : null); });
		},
		setUserProperty: function (key, value) {
			const props = {};
			props[key] = value;
			withAnalytics(function (a) { a.setUserProperties(props); });
		},
		// La sortie du moteur (onExit de Godot, plus bas).
		reportExit: function (code) {
			if (code) reportError('engine exited with code ' + code, 'engine', true);
		},
		pushState: pushState,
		requestPush: function (cb) {
			const done = function (token) { setTimeout(function () { cb(token || ''); }, 0); };
			if (pushState() === 'unsupported') return done('');
			askPermission()
				.then(function (permission) {
					if (permission !== 'granted') return '';
					return Promise.all([bootMessaging(), worker()]).then(function (r) {
						if (!r[0] || !messaging) return '';
						return messaging.getToken({ vapidKey: cfg.vapidKey, serviceWorkerRegistration: r[1] });
					});
				})
				.then(done, function (e) {
					console.warn('[rrFirebase] push:', e && e.message);
					done('');
				});
		},
		launchPath: function () {
			const path = launch;
			launch = '';
			return path;
		},
		onPushOpened: function (cb) {
			openedCb = function (path) { setTimeout(function () { cb(path); }, 0); };
			while (openedQueue.length) openedCb(openedQueue.shift());
		},
	};
})();
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// UNE PAGE PEUT FAIRE ATTENDRE LE DEPART (`window.rrBeforeStart`, une
		// promesse) : rabbit.rip/play/ y regarde d'abord si ce navigateur
		// porte un terrier d'avant le demenagement (site/play/move.js).
		const ready = window.rrBeforeStart ? window.rrBeforeStart() : Promise.resolve();
		ready.then(() => engine.startGame({
			// UNE SORTIE EN ERREUR du moteur (un abandon que Godot a vu venir) :
			// rapportee comme fatale. Les abandons brutaux passent par
			// window.onerror, plus haut.
			'onExit': function (code) {
				if (window.rrFirebase) window.rrFirebase.reportExit(code);
			},
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const fill = Math.min(current / total, 1);
					// Par rangees entieres du sprite (30 px de haut) : le bord
					// ne coupe jamais un pixel en deux. La carotte n'occupe que
					// les rangees 8 a 28 ; au-dessus c'est du vide, qu'on ne
					// compte pas, sinon elle parait pleine des 73 %.
					const rows = Math.floor(fill * 21);
					statusProgress.style.setProperty('--fill', (rows + 1) / 30);
					statusPercent.textContent = Math.floor(fill * 100) + ' %';
					// Tout est la : reste la compilation du wasm, muette.
					statusProgress.classList.toggle('busy', fill >= 1);
				} else {
					statusProgress.classList.add('busy');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
