		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* LA CAROTTE QUI SE REMPLIT, a la place de la barre bleue du navigateur.
   Deux fois la meme icone 32x30 (ui/icons/carrot), agrandie au pixel pres :
   dessous la silhouette eteinte, dessus la carotte en couleur, decouverte
   de la pointe (en bas) vers les fanes (en haut) a mesure que les octets
   arrivent. --fill va de 0 a 1. Le splash de Godot est masque : la carotte
   tient seule le centre de l'ecran. */
#status-splash {
	display: none;
}

#status-progress {
	position: relative;
	flex-direction: column;
	align-items: center;
	gap: 1.25rem;
	--fill: 0;
}

.carrot {
	position: relative;
	width: 192px;
	height: 180px;
}

.carrot img {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}

.carrot .carrot-empty {
	filter: brightness(0) invert(1);
	opacity: 0.12;
}

.carrot .carrot-full {
	clip-path: inset(calc((1 - var(--fill)) * 100%) 0 0 0);
}

/* Taille inconnue (pas de Content-Length) ou telechargement fini pendant que
   le wasm compile : la carotte, pleine ou non, respire. */
#status-progress.busy .carrot {
	animation: carrot-bob 0.9s ease-in-out infinite;
}

@keyframes carrot-bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

#status-percent {
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 14px;
	letter-spacing: 0.08em;
	color: #f5a04a;
	opacity: 0.85;
	min-height: 1em;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* TOURNE TON TELEPHONE (2026-09-30). Le jeu est fait couche : en portrait
   sur iPhone il demarrait debout puis basculait, sans rien dire. Safari ne
   laisse pas une page verrouiller l'orientation — on le demande donc. CSS
   seul : le voile vient et part avec le telephone, avant meme le moteur. */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #1b1f2a;
	color: #f5e6c8;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
	font-size: 16px;
	letter-spacing: 0.04em;
	text-align: center;
	padding: 0 32px;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate { display: flex; }
}

#rotate .phone {
	width: 44px;
	height: 76px;
	border: 4px solid #f5a04a;
	border-radius: 8px;
	box-sizing: border-box;
	animation: rotate-phone 2.4s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(0deg); }
	50%, 80% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

		<script>
/* LE WALLET DU NAVIGATEUR, pour wallet.gd (branche web).
   Android a son plugin MWA ; ici c'est le wallet injecte (Phantom, Solflare,
   Backpack...). Godot ne sait pas attendre une Promise : chaque appel prend
   un rappel (valeur, erreur), et la valeur vide veut dire refus ou panne.
   Le rappel n'est JAMAIS synchrone : Godot n'a pas encore commence a
   attendre quand l'appel revient, et un signal emis trop tot est perdu. */
window.rrWalletWeb = (function () {
	const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
	function base58(bytes) {
		const digits = [];
		for (const byte of bytes) {
			let carry = byte;
			for (let i = 0; i < digits.length; i++) {
				carry += digits[i] << 8;
				digits[i] = carry % 58;
				carry = (carry / 58) | 0;
			}
			while (carry > 0) {
				digits.push(carry % 58);
				carry = (carry / 58) | 0;
			}
		}
		let out = '';
		for (let i = 0; i < bytes.length && bytes[i] === 0; i++) out += '1';
		for (let i = digits.length - 1; i >= 0; i--) out += ALPHABET[digits[i]];
		return out;
	}
	function provider() {
		const phantom = window.phantom && window.phantom.solana;
		if (phantom) return phantom;
		if (window.solflare && window.solflare.signMessage) return window.solflare;
		if (window.backpack && window.backpack.signMessage) return window.backpack;
		return window.solana || null;
	}
	let web3Promise = null;
	function loadWeb3() {
		if (window.solanaWeb3) return Promise.resolve(window.solanaWeb3);
		web3Promise = web3Promise || new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = 'https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js';
			s.onload = function () { resolve(window.solanaWeb3); };
			s.onerror = function () { web3Promise = null; reject(new Error('could not load the payment library')); };
			document.head.appendChild(s);
		});
		return web3Promise;
	}
	function reason(e) {
		// 4001 = l'utilisateur a ferme la fenetre : un refus, pas une panne.
		if (e && (e.code === 4001 || /reject|denied|cancel/i.test(String(e.message)))) return '';
		return String((e && e.message) || e || 'wallet error');
	}
	return {
		available: function () { return provider() !== null; },
		address: function (cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			Promise.resolve(w.connect())
				.then(function (r) {
					const key = (r && r.publicKey) || w.publicKey;
					cb(key ? key.toString() : '', '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
		// PAYER : la transaction vient du serveur, en base64, non signee. Le
		// wallet de l'extension veut un objet Transaction, pas des octets :
		// web3.js est charge au PREMIER paiement (jsdelivr), jamais au boot —
		// ~140 Ko gzip pour une boutique que la plupart n'ouvrent pas.
		send: function (txBase64, _cluster, cb) {
			const w = provider();
			if (!w || !w.signAndSendTransaction) return setTimeout(function () { cb('', ''); }, 0);
			loadWeb3()
				.then(function (web3) {
					const bytes = Uint8Array.from(atob(txBase64), function (c) { return c.charCodeAt(0); });
					return Promise.resolve(w.connect()).then(function () {
						return w.signAndSendTransaction(web3.Transaction.from(bytes));
					});
				})
				.then(function (r) {
					const sig = (r && r.signature) || r;
					cb(typeof sig === 'string' ? sig : base58(new Uint8Array(sig)), '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
		sign: function (message, cb) {
			const w = provider();
			if (!w) return setTimeout(function () { cb('', ''); }, 0);
			Promise.resolve(w.signMessage(new TextEncoder().encode(message), 'utf8'))
				.then(function (r) {
					const sig = (r && r.signature) || r;
					cb(typeof sig === 'string' ? sig : base58(new Uint8Array(sig)), '');
				})
				.catch(function (e) { cb('', reason(e)); });
		},
	};
})();
		</script>
		<!-- La config web de Firebase (publique), copiee a cote de index.html
		     par le Dockerfile. Placeholders « TODO » : tout reste muet. -->
		<script src="firebase-config.js"></script>
		<script>
/* FIREBASE, pour analytics.gd et push.gd (branche web).
   Android a son plugin RabbitFirebase ; ici c'est le SDK JS « compat »,
   epingle sur gstatic et charge EN DIFFERE : jamais sur le chemin du boot (le
   moteur passe d'abord), et jamais du tout tant que la config porte des TODO.

   Le contrat, le meme que le plugin :
     logEvent(nom, paramsJson)   setUserId(id)   setUserProperty(cle, valeur)
     requestPush(cb)   -> cb(jeton), "" sur refus, panne ou config absente
     pushState()       -> 'granted' | 'denied' | 'default' | 'unsupported'
     launchPath()      -> le chemin de la notification qui a ouvert la page
                          (?push=), une seule fois ; "" sinon
     onPushOpened(cb)  -> cb(chemin) quand une notification est tapee alors
                          que le jeu est deja ouvert (le service worker nous
                          le poste au lieu d'ouvrir un second onglet)
   Comme rrWalletWeb, un rappel n'est JAMAIS synchrone : Godot n'a pas encore
   commence a attendre quand l'appel revient.

   Les appels d'analytics faits avant que le SDK soit la attendent dans une
   petite file, videe a son arrivee ; si le SDK ne vient pas (bloqueur,
   hors ligne), la file est jetee sans bruit. */
window.rrFirebase = (function () {
	const VERSION = '12.19.0';
	const BASE = 'https://www.gstatic.com/firebasejs/' + VERSION + '/';
	const cfg = window.RR_FIREBASE_CONFIG || null;
	function filled(k) {
		return !!cfg && typeof cfg[k] === 'string' && cfg[k] !== '' && !/TODO/.test(cfg[k]);
	}
	const configured = ['apiKey', 'authDomain', 'projectId', 'messagingSenderId', 'appId', 'measurementId'].every(filled);
	const pushConfigured = configured && filled('vapidKey');
	// DebugView de GA4 : /play/?analytics_debug
	const debug = /[?&]analytics_debug\b/.test(location.search);

	// Le chemin d'une notification qui a ouvert la page, lu UNE fois et retire
	// de l'adresse : un rechargement ne doit pas rejouer la tape.
	let launch = '';
	try {
		const url = new URL(location.href);
		launch = url.searchParams.get('push') || '';
		if (launch) {
			url.searchParams.delete('push');
			history.replaceState(history.state, '', url.pathname + url.search + url.hash);
		}
	} catch (e) { launch = ''; }

	// La tape sur une notification, jeu deja ouvert : postee par le worker.
	let openedCb = null;
	const openedQueue = [];
	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.addEventListener('message', function (e) {
			const path = e.data && e.data.rrPush;
			if (typeof path !== 'string' || !path) return;
			if (openedCb) openedCb(path); else openedQueue.push(path);
		});
	}

	let analytics = null;
	let messaging = null;
	let booting = null;
	let queue = [];
	const QUEUE_MAX = 200;

	function load(src) {
		return new Promise(function (resolve, reject) {
			const s = document.createElement('script');
			s.src = src;
			s.async = true;
			s.onload = resolve;
			s.onerror = function () { reject(new Error('could not load ' + src)); };
			document.head.appendChild(s);
		});
	}

	function boot() {
		if (!configured) return Promise.resolve(false);
		if (booting) return booting;
		booting = load(BASE + 'firebase-app-compat.js')
			.then(function () {
				return Promise.all([
					load(BASE + 'firebase-analytics-compat.js'),
					pushConfigured ? load(BASE + 'firebase-messaging-compat.js') : null,
				]);
			})
			.then(function () {
				const app = firebase.initializeApp(cfg);
				return Promise.all([
					firebase.analytics.isSupported().then(function (ok) {
						if (ok) analytics = firebase.analytics(app);
					}),
					pushConfigured && firebase.messaging && firebase.messaging.isSupported
						? Promise.resolve(firebase.messaging.isSupported()).then(function (ok) {
							if (ok) messaging = firebase.messaging(app);
						})
						: null,
				]);
			})
			.then(function () {
				const pending = queue;
				queue = [];
				pending.forEach(function (fn) { fn(); });
				return true;
			})
			.catch(function (e) {
				// Un bloqueur, le reseau : le jeu n'a pas a le savoir.
				console.warn('[rrFirebase] off:', e && e.message);
				queue = [];
				return false;
			});
		return booting;
	}

	// Chaque appel d'analytics passe par ici : tout de suite si le SDK est la,
	// sinon dans la file (bornee), sinon nulle part.
	function withAnalytics(fn) {
		if (!configured) return;
		const run = function () { if (analytics) { try { fn(analytics); } catch (e) { /* muet */ } } };
		if (analytics) return run();
		if (queue.length < QUEUE_MAX) queue.push(run);
		boot();
	}

	// Le worker des notifications, sous /play/ et a portee /play/, ACTIF avant
	// que getToken le lise.
	function worker() {
		return navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './' })
			.then(function (reg) {
				if (reg.active) return reg;
				return new Promise(function (resolve) {
					const sw = reg.installing || reg.waiting;
					if (!sw) return resolve(reg);
					sw.addEventListener('statechange', function () {
						if (sw.state === 'activated') resolve(reg);
					});
				});
			});
	}

	function pushState() {
		if (!pushConfigured || !('Notification' in window) || !('serviceWorker' in navigator)
			|| !('PushManager' in window)) return 'unsupported';
		return Notification.permission;
	}

	// La demande DOIT partir dans le geste du joueur : on l'appelle avant tout
	// `then`. Les vieux Safari rendent la reponse a un rappel, pas une Promise.
	function askPermission() {
		if (Notification.permission === 'granted') return Promise.resolve('granted');
		return new Promise(function (resolve) {
			const ret = Notification.requestPermission(resolve);
			if (ret && ret.then) ret.then(resolve);
		});
	}

	return {
		logEvent: function (name, paramsJson) {
			let params = {};
			try { params = JSON.parse(paramsJson || '{}') || {}; } catch (e) { params = {}; }
			// Les rapports d'ecrans de GA4 lisent firebase_screen*, que Godot ne
			// peut pas nommer (prefixe reserve, analytics.gd le retire).
			if (name === 'screen_view') {
				params.firebase_screen = params.screen_name;
				params.firebase_screen_class = params.screen_class;
			}
			if (debug) params.debug_mode = true;
			withAnalytics(function (a) { a.logEvent(name, params); });
		},
		setUserId: function (id) {
			withAnalytics(function (a) { a.setUserId(id ? String(id) : null); });
		},
		setUserProperty: function (key, value) {
			const props = {};
			props[key] = value;
			withAnalytics(function (a) { a.setUserProperties(props); });
		},
		pushState: pushState,
		requestPush: function (cb) {
			const done = function (token) { setTimeout(function () { cb(token || ''); }, 0); };
			if (pushState() === 'unsupported') return done('');
			askPermission()
				.then(function (permission) {
					if (permission !== 'granted') return '';
					return Promise.all([boot(), worker()]).then(function (r) {
						if (!r[0] || !messaging) return '';
						return messaging.getToken({ vapidKey: cfg.vapidKey, serviceWorkerRegistration: r[1] });
					});
				})
				.then(done, function (e) {
					console.warn('[rrFirebase] push:', e && e.message);
					done('');
				});
		},
		launchPath: function () {
			const path = launch;
			launch = '';
			return path;
		},
		onPushOpened: function (cb) {
			openedCb = function (path) { setTimeout(function () { cb(path); }, 0); };
			while (openedQueue.length) openedCb(openedQueue.shift());
		},
	};
})();
		</script>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const fill = Math.min(current / total, 1);
					// Par rangees entieres du sprite (30 px de haut) : le bord
					// ne coupe jamais un pixel en deux. La carotte n'occupe que
					// les rangees 8 a 28 ; au-dessus c'est du vide, qu'on ne
					// compte pas, sinon elle parait pleine des 73 %.
					const rows = Math.floor(fill * 21);
					statusProgress.style.setProperty('--fill', (rows + 1) / 30);
					statusPercent.textContent = Math.floor(fill * 100) + ' %';
					// Tout est la : reste la compilation du wasm, muette.
					statusProgress.classList.toggle('busy', fill >= 1);
				} else {
					statusProgress.classList.add('busy');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
