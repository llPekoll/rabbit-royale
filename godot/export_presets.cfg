[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../dist/rabbit-royale.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; OBLIGATOIRE pour un plugin Android v2 : le template pré-compilé ne sait pas
; fusionner un manifest ni résoudre des dépendances Maven. À true, l'export
; compile réellement l'app depuis res://android/build (menu Projet > Installer
; le modèle de compilation Android), ce qui est la seule façon d'embarquer
; l'AAR du Seed Vault.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="rip.rabbit.royale"
package/name="Rabbit Royale"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
; true, sinon l'APK s'installe mais n'a NI icône NI activité lançable : le jeu
; est sur le téléphone et rien ne permet de l'ouvrir. `adb shell am start`
; échoue pareil — il n'y a pas d'intent-filter LAUNCHER à viser.
package/show_as_launcher_app=true
launcher_icons/main_192x192="res://assets/ui/icon-192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/ui/icon-fg-432.png"
launcher_icons/adaptive_background_432x432="res://assets/ui/icon-bg-432.png"
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
permissions/internet=true

